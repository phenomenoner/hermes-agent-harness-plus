name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[mcp,dev]'
      - name: Test
        run: python -m pytest -q
      - name: Check Prime extension syntax
        run: node --check plugins/prime-minion/prime_extension.mjs
