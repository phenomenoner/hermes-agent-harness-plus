[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-harness-plus"
version = "0.1.0"
description = "Public-safe harness extensions for Hermes Agent."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "hermes-agent-harness-plus contributors"}]
keywords = ["hermes-agent", "mcp", "qdrant", "agent-tools", "task-canvas"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
mcp = ["mcp>=1.22.0"]
qdrant = ["fastembed>=0.8.0"]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[tool.setuptools]
package-dir = {"" = "packages/context-canvas"}

[tool.setuptools.packages.find]
where = ["packages/context-canvas"]
include = ["context_canvas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
